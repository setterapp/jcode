[package]
name = "jcode-tool-web"
version = "0.1.0"
edition = "2024"
description = "Web tools for the agent — websearch, webfetch"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["sync"] }
scraper = "0.22"
anyhow = "1"
tracing = "0.1"
url = "2"

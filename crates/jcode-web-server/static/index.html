<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jcode Web</title>
<style>
  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #1c2128;
    --border: #30363d;
    --text: #e6edf3;
    --text2: #8b949e;
    --accent: #58a6ff;
    --accent2: #2ea043;
    --red: #f85149;
    --orange: #d29922;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; background: var(--bg2); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; font-weight: 600; color: var(--text); }
  header h1 span { color: var(--accent); }
  header .model-badge {
    font-size: 12px; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; color: var(--text2);
  }
  header .status { font-size: 12px; display: flex; align-items: center; gap: 6px; }
  header .status .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  header .status.connected .dot { background: var(--accent2); }
  header .status.disconnected .dot { background: var(--red); }
  header .status.connected { color: var(--accent2); }
  header .status.disconnected { color: var(--red); }
  .layout { display: flex; flex: 1; overflow: hidden; }
  .sidebar {
    width: 280px; background: var(--bg2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar-header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    font-size: 12px; font-weight: 600; color: var(--text2);
    text-transform: uppercase; letter-spacing: 0.5px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .sidebar-header button {
    background: var(--accent); color: #fff; border: none; border-radius: 4px;
    padding: 3px 10px; font-size: 11px; cursor: pointer;
  }
  .sidebar-header button:hover { opacity: 0.85; }
  .session-list { flex: 1; overflow-y: auto; }
  .session-item {
    padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
    transition: background 0.15s;
  }
  .session-item:hover { background: var(--bg3); }
  .session-item.active { background: var(--bg3); border-left: 3px solid var(--accent); }
  .session-title { font-size: 13px; font-weight: 500; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-meta { font-size: 11px; color: var(--text2); }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .messages {
    flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px;
  }
  .message { max-width: 80%; animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .message.user { align-self: flex-end; }
  .message.assistant { align-self: flex-start; }
  .message.system { align-self: center; max-width: 100%; }
  .message .bubble {
    padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5;
    word-wrap: break-word; white-space: pre-wrap;
  }
  .message.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .message.assistant .bubble { background: var(--bg3); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .message.system .bubble { background: transparent; border: none; font-size: 12px; color: var(--text2); text-align: center; }
  .message .meta { font-size: 11px; color: var(--text2); margin-top: 4px; padding: 0 4px; }
  .empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text2); text-align: center; padding: 40px;
  }
  .empty-state h2 { font-size: 20px; margin-bottom: 8px; color: var(--text); }
  .empty-state p { font-size: 14px; max-width: 360px; line-height: 1.6; }
  .input-area {
    padding: 12px 20px; border-top: 1px solid var(--border); background: var(--bg2);
    display: flex; gap: 8px;
  }
  .input-area textarea {
    flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; color: var(--text); font-size: 14px; resize: none;
    outline: none; min-height: 44px; max-height: 120px; font-family: inherit;
  }
  .input-area textarea:focus { border-color: var(--accent); }
  .input-area button {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 10px 20px; font-size: 14px; cursor: pointer; font-weight: 500;
    align-self: flex-end; min-height: 44px;
  }
  .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
  .input-area button:hover:not(:disabled) { opacity: 0.85; }
  .loading { text-align: center; padding: 20px; color: var(--text2); }
  .loading .spinner {
    width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tool-call {
    background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; margin: 8px 0; font-size: 12px; color: var(--text2);
  }
  .tool-call .tool-name { color: var(--orange); font-weight: 500; }
  .thinking {
    background: transparent; border-left: 2px solid var(--border);
    padding: 8px 14px; margin: 4px 0; font-size: 13px; color: var(--text2);
    font-style: italic;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text2); }
</style>
</head>
<body>

<header>
  <h1><span>j</span>code <span style="font-weight:400;font-size:12px;color:var(--text2);margin-left:8px;">beta</span></h1>
  <div style="display:flex;align-items:center;gap:16px;">
    <span class="status" id="status-indicator"><span class="dot"></span> Connecting...</span>
    <span class="model-badge" id="model-badge">Loading...</span>
  </div>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-header">
      Sessions
      <button onclick="newSession()">+ New</button>
    </div>
    <div class="session-list" id="session-list">
      <div class="loading"><div class="spinner"></div>Loading sessions...</div>
    </div>
  </div>

  <div class="main">
    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <div>
          <h2>Select a session</h2>
          <p>Choose a session from the sidebar or start a new conversation.</p>
        </div>
      </div>
    </div>

    <div class="input-area" id="input-area" style="display:none;">
      <textarea id="input" placeholder="Send a message..." rows="1" onkeydown="handleKey(event)"></textarea>
      <button id="send-btn" onclick="sendMessage()" disabled>Sending...</button>
    </div>
  </div>
</div>

<script>
const WS_BASE = window.location.origin.replace(/^http/, 'ws');
let currentSession = null;
let sessions = [];
let ws = null;
let msgId = 100;
let connected = false;

// ── WebSocket connection ──
function connectWS() {
  ws = new WebSocket(`${WS_BASE}/ws`);

  ws.onopen = () => {
    connected = true;
    updateStatus(true);
    enableInput(true);
    document.getElementById('send-btn').textContent = 'Send';
    // Subscribe to daemon events to get real-time updates
    sendWS({type: 'subscribe', id: msgId++, working_dir: '.', client_has_local_history: false, allow_session_takeover: false});
  };

  ws.onclose = () => {
    connected = false;
    updateStatus(false);
    enableInput(false);
    document.getElementById('send-btn').textContent = 'Reconnecting...';
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => {
    ws.close();
  };

  ws.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);
      handleDaemonEvent(msg);
    } catch (e) {
      console.warn('Failed to parse daemon message:', e);
    }
  };
}

function sendWS(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(data));
  }
}

// ── Handle daemon events ──
function handleDaemonEvent(msg) {
  const msgs = document.getElementById('messages');

  switch (msg.type) {
    case 'ack':
      // Acknowledge — ignore
      break;

    case 'done':
      // Generation done — remove loading indicator
      removeLoading();
      updateStatus(true);
      enableInput(true);
      document.getElementById('send-btn').textContent = 'Send';
      refreshSessionList();
      break;

    case 'text_delta':
      // Streaming text — append to or update the last assistant message
      appendStreamingText(msg.text || '');
      break;

    case 'text':
      // Full text (not streaming)
      break;

    case 'tool_start':
    case 'tool_call':
      // Tool is being called
      removeLoading();
      const toolName = msg.tool_name || msg.name || 'tool';
      const toolId = msg.tool_call_id || msg.id || 'tool-' + Date.now();
      msgs.insertAdjacentHTML('beforeend', `<div class="message assistant tool-msg" data-tool-id="${toolId}">
        <div class="tool-call">🔧 <span class="tool-name">${escapeHtml(toolName)}</span></div>
        <div class="meta">running tool</div>
      </div>`);
      msgs.scrollTop = msgs.scrollHeight;
      break;

    case 'tool_result':
      // Tool completed — mark it
      const toolEl = msgs.querySelector(`[data-tool-id="${msg.tool_call_id || ''}"]`);
      if (toolEl) {
        const detail = msg.output ? escapeHtml(String(msg.output).substring(0, 200)) : '';
        toolEl.querySelector('.tool-call').innerHTML += detail ? ` — completed` : '✓ completed';
        toolEl.querySelector('.meta').textContent = 'completed';
      }
      break;

    case 'status':
      // Status update
      if (msg.status === 'processing' || msg.status === 'thinking') {
        showLoading('Thinking...');
        updateStatus(true);
      }
      break;

    case 'error':
      removeLoading();
      msgs.insertAdjacentHTML('beforeend', `<div class="message system">
        <div class="bubble" style="color:var(--red)">Error: ${escapeHtml(msg.message || 'unknown error')}</div>
        <div class="meta">error</div>
      </div>`);
      updateStatus(true);
      enableInput(true);
      document.getElementById('send-btn').textContent = 'Send';
      break;

    case 'history':
      // Full history — render all messages
      renderMessages(msg.messages || []);
      break;

    case 'state':
      // State snapshot — update model badge
      if (msg.model) {
        document.getElementById('model-badge').textContent = escapeHtml(msg.model);
      }
      break;

    default:
      // Unknown event — could be a pong or other
      if (msg.type === 'pong') {
        // ignore
      }
  }
}

function showLoading(text) {
  const msgs = document.getElementById('messages');
  let el = document.getElementById('loading-msg');
  if (!el) {
    msgs.insertAdjacentHTML('beforeend', `<div class="message assistant" id="loading-msg">
      <div class="bubble"><div class="loading"><div class="spinner"></div>${escapeHtml(text || 'Thinking...')}</div></div>
    </div>`);
    msgs.scrollTop = msgs.scrollHeight;
  }
}

function removeLoading() {
  const el = document.getElementById('loading-msg');
  if (el) el.remove();
}

function appendStreamingText(text) {
  const msgs = document.getElementById('messages');
  let lastMsg = msgs.lastElementChild;
  if (lastMsg && lastMsg.classList.contains('assistant') && !lastMsg.classList.contains('system') && !lastMsg.classList.contains('tool-msg') && !lastMsg.id) {
    // Update existing assistant message
    const bubble = lastMsg.querySelector('.bubble');
    if (bubble) {
      bubble.textContent += text;
      msgs.scrollTop = msgs.scrollHeight;
    }
  } else {
    // Create new assistant message
    removeLoading();
    msgs.insertAdjacentHTML('beforeend', `<div class="message assistant">
      <div class="bubble">${escapeHtml(text)}</div>
      <div class="meta">assistant</div>
    </div>`);
    msgs.scrollTop = msgs.scrollHeight;
  }
}

function updateStatus(ok) {
  const el = document.getElementById('status-indicator');
  el.className = 'status ' + (ok ? 'connected' : 'disconnected');
  el.innerHTML = `<span class="dot"></span> ${ok ? 'Connected' : 'Disconnected'}`;
}

function enableInput(enabled) {
  const input = document.getElementById('input');
  const btn = document.getElementById('send-btn');
  input.disabled = !enabled;
  btn.disabled = !enabled;
}

// ── API helpers ──
async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ── Session list ──
async function loadSessions() {
  try {
    const data = await api('/api/sessions');
    sessions = data;
    renderSessions();
  } catch (e) {
    document.getElementById('session-list').innerHTML =
      `<div class="loading" style="color:var(--red)">Failed to load sessions: ${e.message}</div>`;
  }
}

function refreshSessionList() {
  api('/api/sessions').then(data => {
    sessions = data;
    renderSessions();
  }).catch(() => {});
}

function renderSessions() {
  const list = document.getElementById('session-list');
  if (sessions.length === 0) {
    list.innerHTML = `<div class="loading">No sessions yet. Start a new one!</div>`;
    return;
  }
  list.innerHTML = sessions.map(s => `
    <div class="session-item ${currentSession && s.id === currentSession ? 'active' : ''}"
         onclick="selectSession('${s.id}')">
      <div class="session-title">${escapeHtml(s.title || s.id.substring(0, 12))}</div>
      <div class="session-meta">${s.message_count || 0} msgs · ${s.created_at ? new Date(s.created_at).toLocaleDateString() : '?'}</div>
    </div>
  `).join('');
}

// ── Session selection ──
async function selectSession(id) {
  currentSession = id;
  renderSessions();
  document.getElementById('input-area').style.display = '';
  document.getElementById('empty-state').style.display = 'none';
  enableInput(true);

  const msgs = document.getElementById('messages');
  msgs.innerHTML = '<div class="loading"><div class="spinner"></div>Loading messages...</div>';

  try {
    const data = await api(`/api/sessions/${id}`);
    const messages = data.messages || [];
    renderMessages(messages);
    if (data.model) {
      document.getElementById('model-badge').textContent = data.model;
    }
    // Resume session via daemon
    if (connected) {
      sendWS({type: 'resume_session', id: msgId++, session_id: id, client_has_local_history: false, allow_session_takeover: false});
    }
  } catch (e) {
    msgs.innerHTML = `<div class="empty-state"><p style="color:var(--red)">${e.message}</p></div>`;
  }
}

function renderMessages(messages) {
  const msgs = document.getElementById('messages');
  if (!messages || messages.length === 0) {
    msgs.innerHTML = `<div class="empty-state"><p>No messages yet. Say something!</p></div>`;
    return;
  }
  msgs.innerHTML = messages.map(m => {
    const role = m.role === 'user' ? 'user' : 'assistant';
    const content = m.content || '';
    const time = m.timestamp ? new Date(m.timestamp).toLocaleTimeString() : '';
    return `<div class="message ${role}">
      <div class="bubble">${escapeHtml(content)}</div>
      <div class="meta">${role}${time ? ' · ' + time : ''}</div>
    </div>`;
  }).join('');
  msgs.scrollTop = msgs.scrollHeight;
}

// ── Send message ──
function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || !currentSession || !connected) return;
  input.value = '';

  const msgs = document.getElementById('messages');
  const empty = msgs.querySelector('.empty-state');
  if (empty) empty.remove();

  // Add user message
  msgs.insertAdjacentHTML('beforeend', `<div class="message user">
    <div class="bubble">${escapeHtml(text)}</div>
    <div class="meta">user · just now</div>
  </div>`);

  // Show loading (will be replaced by streaming or result)
  msgs.insertAdjacentHTML('beforeend', `<div class="message assistant" id="loading-msg">
    <div class="bubble"><div class="loading"><div class="spinner"></div>Waiting for agent...</div></div>
  </div>`);
  msgs.scrollTop = msgs.scrollHeight;

  enableInput(false);
  document.getElementById('send-btn').textContent = 'Sending...';

  // First subscribe to the session, then send the message
  sendWS({type: 'resume_session', id: msgId++, session_id: currentSession, client_has_local_history: true, allow_session_takeover: false});
  sendWS({type: 'message', id: msgId++, content: text, images: []});
}

// ── New session ──
function newSession() {
  const name = prompt('Session name (optional):');
  if (name === null) return;
  // TODO: create session via daemon
  loadSessions();
}

// ── Keyboard ──
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// ── Helpers ──
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Init ──
connectWS();
loadSessions();
</script>
</body>
</html>

[package]
name = "jcode-tui-dialogs"
version = "0.1.0"
edition = "2024"
description = "Interactive dialog overlays for TUI — model/agent/theme/session pickers"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"

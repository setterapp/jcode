[package]
name = "jcode-mcp-core"
version = "0.1.0"
edition = "2024"
description = "MCP (Model Context Protocol) client — stdio/SSE transport, tool discovery, OAuth"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
anyhow = "1"
thiserror = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
url = "2"
sha2 = "0.10"
base64 = { version = "0.22", features = ["std"] }
rand = "0.9.3"

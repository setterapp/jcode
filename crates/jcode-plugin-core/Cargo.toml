[package]
name = "jcode-plugin-core"
version = "0.1.0"
edition = "2024"
description = "Plugin system — install from npm/git, manifest resolution, dynamic loading"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["process", "fs", "sync"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
semver = "1"
glob = "0.3"
